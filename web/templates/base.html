<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Swap Regret Dashboard{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='dashboard.css') }}">
</head>
<body>
    <a class="skip-link" href="#main-content">Skip to content</a>

    <header class="site-header">
        <a class="site-brand" href="{{ url_for('dashboard.index') }}">Swap Regret</a>
        <nav class="site-navigation" aria-label="Main navigation">
            <a href="{{ url_for('dashboard.index') }}" {% if request.endpoint == 'dashboard.index' %}aria-current="page"{% endif %}>Experiments</a>
            <a href="{{ url_for('dashboard.custom_games') }}" {% if request.endpoint and request.endpoint.startswith('dashboard.custom') %}aria-current="page"{% endif %}>Custom games</a>
        </nav>
    </header>

    <div id="notice-stack" class="flash-stack" aria-live="polite">
        {% for category, message in get_flashed_messages(with_categories=true) %}
            <div class="notice notice-{{ category }}">{{ message }}</div>
        {% endfor %}
    </div>

    {% block content %}{% endblock %}
    <script src="{{ url_for('static', filename='common.js') }}" defer></script>
    {% block scripts %}{% endblock %}
</body>
</html>
