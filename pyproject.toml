[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "swap-regret-thesis"
version = "0.1.0"
description = "Experimental framework for no-regret and no-swap-regret learning in repeated games"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "flask",
    "matplotlib",
    "numpy",
    # games_learning's pinned editable checkout is installed by the Makefile
    # because its wheel omits the game and utils subpackages used here.
    "PuLP==2.9.0",
    "scipy",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
swap-regret = "main:main"
swap-regret-web = "web.app:main"

[tool.setuptools]
py-modules = ["config", "main"]

[tool.setuptools.packages.find]
where = ["."]
include = [
    "algorithms*",
    "environments*",
    "experiments*",
    "metrics*",
    "web*",
]
exclude = ["tests*"]
namespaces = true

[tool.setuptools.package-data]
web = [
    "templates/*.html",
    "static/*.css",
    "static/*.js",
    "static/equilibria/*.png",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
