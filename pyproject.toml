[build-system]
requires = ["setuptools==69.5.1"]
build-backend = "setuptools.build_meta"

[project]
name = "swap-regret-thesis"
version = "0.1.0"
description = "Experimental framework for no-regret and no-swap-regret learning in repeated games"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "flask==3.1.3",
    "matplotlib==3.10.8",
    "numpy==2.2.6",
    "Pillow==9.0.1",
    "pypdf==6.18.0",
    "scipy==1.15.3",
]

[project.optional-dependencies]
test = ["pytest==9.0.3"]

[project.scripts]
swap-regret-web = "web.app:main"

[tool.setuptools]
py-modules = ["config"]

[tool.setuptools.packages.find]
include = ["algorithms*", "environments*", "experiments*", "metrics*", "web*"]
exclude = ["tests*"]
namespaces = false

[tool.setuptools.package-data]
web = ["templates/*.html", "static/*.css", "static/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
